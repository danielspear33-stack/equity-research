# Refreshes every company on the watchlist after the US market closes and
# commits the new snapshot back to the repository.
name: Daily watchlist refresh

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC, Monday to Friday
  workflow_dispatch:           # also lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh watchlist
        env:
          # Add this under Settings > Secrets and variables > Actions.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m research.refresh
      - name: Save snapshot
        run: |
          git config user.name "watchlist-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add userdata
          git diff --cached --quiet || git commit -m "Daily watchlist snapshot"
          git push
